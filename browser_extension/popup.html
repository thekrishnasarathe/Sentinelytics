<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinelytics Collector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      background-color: #0f172a;
      color: #f1f5f9;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #059669, #0284c7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .version {
      font-size: 10px;
      background: #1e293b;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 600;
      border: 1px solid #334155;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-label {
      font-size: 12px;
      color: #94a3b8;
    }
    .platform-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .platform-youtube { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .platform-instagram { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }
    .platform-flipkart { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .platform-amazon { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .platform-myntra { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }
    .platform-meesho { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .platform-nykaa { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }
    .platform-ajio { background: rgba(20, 184, 166, 0.2); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.4); }
    .platform-unsupported { background: #334155; color: #94a3b8; }
    
    .item-title {
      font-size: 12px;
      font-weight: 500;
      color: #e2e8f0;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }
    .counter-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
    }
    .counter-number {
      font-size: 32px;
      font-weight: 800;
      color: #10b981;
      font-variant-numeric: tabular-nums;
    }
    .counter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 600;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #10b981;
      color: #022c22;
    }
    .btn-primary:hover:not(:disabled) {
      background: #059669;
      color: #ffffff;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #334155;
    }
    .btn-stop {
      background: #ef4444;
      color: white;
    }
    .btn-stop:hover:not(:disabled) {
      background: #dc2626;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-banner {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      min-height: 16px;
      line-height: 1.4;
    }
    .status-banner.success { color: #34d399; }
    .status-banner.error { color: #f87171; }
    .footer {
      border-top: 1px solid #1e293b;
      padding-top: 10px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">S</div>
      <div class="title">Sentinelytics</div>
    </div>
    <span class="version">LIVE COLLECTOR</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Active Tab:</span>
      <span id="platformPill" class="platform-pill platform-unsupported">Detecting...</span>
    </div>
    <div class="status-label">Target Page:</div>
    <div id="targetTitle" class="item-title">Checking active webpage...</div>
  </div>

  <div class="counter-box">
    <div id="commentCount" class="counter-number">0</div>
    <div class="counter-label">Authentic Comments Extracted</div>
  </div>

  <div class="btn-group">
    <button id="toggleScrollBtn" class="btn btn-secondary" disabled>
      <span>⚡</span> <span id="toggleScrollText">Start Auto-Collector</span>
    </button>
    <button id="paginateBtn" class="btn btn-secondary" style="display: none;">
      <span>📑</span> <span>Fetch Next 5 Pages</span>
    </button>
    <button id="sendToDashboardBtn" class="btn btn-primary" disabled>
      <span>🚀</span> <span>Send & Analyze in Dashboard</span>
    </button>
  </div>

  <div id="statusBanner" class="status-banner">Ready to collect from active tab.</div>

  <div class="footer">
    <span>Backend: <strong id="backendStatus">http://localhost:8000</strong></span>
    <a id="openDashboardLink" href="http://localhost:3000" target="_blank">Open UI ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
